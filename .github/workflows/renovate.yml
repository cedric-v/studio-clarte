name: renovate

# Self-hosted Renovate via GitHub Actions.
#
# The Renovate GitHub App is NOT installed on this repo (no webhook is
# registered — the install covers other repos only), so the bot runs here
# instead of as a GitHub App. Behavior is identical: it reads `renovate.json`
# at the repo root, opens dependency PRs, maintains the Dependency Dashboard
# issue, and automerges minor/patch updates once the `ci` gate is green.
#
# Requires one repo secret: RENOVATE_TOKEN
#   - fine-grained PAT, or classic PAT with `repo` scope
#   - permissions: "Contents: Read and write" + "Pull requests: Read and write"
#   - A PAT is mandatory: PRs opened with GITHUB_TOKEN do NOT trigger the `ci`
#     workflow, which would deadlock `platformAutomerge` (no green check →
#     no automerge).
#
# If you later enable the Renovate GitHub App on this repo
# (github.com/settings/installations → Renovate → Configure → add
# studio-clarte), DELETE this workflow to avoid duplicate Renovate runs.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # manual "Run workflow" trigger

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check RENOVATE_TOKEN secret
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RENOVATE_TOKEN secret is not set."
            echo "Create a fine-grained PAT (Contents: Read+write, Pull requests: Read+write)"
            echo "on github.com/settings/personal-access-tokens and add it as a repo secret"
            echo "named RENOVATE_TOKEN (github.com/cedric-v/studio-clarte/settings/secrets/actions)."
            exit 1
          fi

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
