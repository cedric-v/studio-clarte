name: Studio Clarté — opération complexe

# This workflow is deliberately opt-in. Studio Clarté dispatches it only when
# a user chooses “Opération complexe”; normal chat generation never executes
# code. Keep this file on the default branch so workflow_dispatch is available.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "The requested operation (copy, Perl/Python, bulk pages, …)"
        required: true
        type: string
      request_id:
        description: "Studio correlation id"
        required: true
        type: string
      base_branch:
        description: "Branch to review against"
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: studio-heavy-${{ inputs.request_id }}
  cancel-in-progress: false

run-name: "Studio Clarté · opération ${{ inputs.request_id }}"

jobs:
  heavy-operation:
    name: Linux agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STUDIO_PROMPT: ${{ inputs.prompt }}
      STUDIO_REQUEST_ID: ${{ inputs.request_id }}
      STUDIO_BASE: ${{ inputs.base_branch }}
      GH_TOKEN: ${{ github.token }}
      # OpenRouter is the default gateway; DeepSeek is the default model.
      # Set STUDIO_HEAVY_PROVIDER / STUDIO_HEAVY_MODEL as repository variables
      # to switch provider or model without changing this workflow.
      STUDIO_PROVIDER: ${{ vars.STUDIO_HEAVY_PROVIDER || 'openrouter' }}
      STUDIO_MODEL: ${{ vars.STUDIO_HEAVY_MODEL || 'deepseek/deepseek-v4-flash' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout the requested base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Prepare an isolated review branch
        run: |
          set -euo pipefail
          git checkout -B "heavy/${STUDIO_REQUEST_ID}" "${STUDIO_BASE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 --version
          perl --version | head -2

      - name: Check the selected model secret
        run: |
          set -euo pipefail
          if [ "${STUDIO_PROVIDER}" = "deepseek" ]; then
            test -n "${DEEPSEEK_API_KEY:-}" || { echo "Missing DEEPSEEK_API_KEY repository secret."; exit 1; }
          else
            test -n "${OPENROUTER_API_KEY:-}" || { echo "Missing OPENROUTER_API_KEY repository secret."; exit 1; }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute the prompt in Linux
        run: |
          set -euo pipefail
          cat > /tmp/studio-clarte-instructions.md <<'EOF'
          You are operating in the checked-out repository on Ubuntu Linux for Studio Clarté.
          Complete the user's request below. You may use the available shell, Python and
          Perl tools, and may create or update multiple files when the request requires it.
          
          Safety and review rules:
          - Work only inside this repository. Never access, print or exfiltrate secrets.
          - Do not push to the default branch and do not merge anything.
          - Do not edit GitHub Actions permissions, secret values, or deployment settings
            unless the user explicitly asks for that exact change.
          - Preserve the existing framework, formatting and content conventions.
          - Run the most relevant lightweight checks before finishing when practical.
          - Do not stop at a plan: perform the requested changes. Do not create a commit;
            the workflow will create the review commit and Pull Request.
          
          User request:
          EOF
          printf '%s\n' "${STUDIO_PROMPT}" >> /tmp/studio-clarte-instructions.md
          # The provider-agnostic agent uses tool calls and keeps CI credentials
          # out of commands executed inside the repository.
          STUDIO_PROMPT="$(cat /tmp/studio-clarte-instructions.md)" \
            node .github/scripts/studio-heavy-agent.mjs

      - name: Commit and open a Pull Request
        run: |
          set -euo pipefail
          git add --all
          if git diff --cached --quiet && [ "$(git rev-list --count "${STUDIO_BASE}..HEAD")" -eq 0 ]; then
            echo "The agent made no repository changes."
            exit 1
          fi
          if [ "$(git rev-list --count "${STUDIO_BASE}..HEAD")" -eq 0 ]; then
            git commit -m "chore: complex operation ${STUDIO_REQUEST_ID}"
          fi
          git push --force-with-lease --set-upstream origin "heavy/${STUDIO_REQUEST_ID}"
          cat > /tmp/studio-pr-body.md <<EOF
          Generated by Studio Clarté on a dedicated Linux runner.
          
          Request id: \`${STUDIO_REQUEST_ID}\`
          
          The operation was requested by an authenticated collaborator. Review the diff
          and the CI checks before merging; this workflow never merges automatically.
          EOF
          gh pr create \
            --base "${STUDIO_BASE}" \
            --head "heavy/${STUDIO_REQUEST_ID}" \
            --title "chore: Studio Clarté complex operation" \
            --body-file /tmp/studio-pr-body.md
