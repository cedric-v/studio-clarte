name: ci

# Lightweight CI gate for every PR (including Renovate dependency PRs) and
# every push to main: type-check + production build. Keeps `platformAutomerge`
# (Renovate) safe — a dependency bump only merges once the build is proven.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-build:
    name: astro check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit des dépendances (vulnérabilités connues)
        # Même exigence qu'avant (aucune vulnérabilité high/critical tolérée),
        # mais les exceptions doivent être datées et justifiées dans
        # scripts/audit-allowlist.json, et une exception expirée casse le job.
        # Sans cela, un avis sans correctif amont (cas picomatch / CVE-2026-112366)
        # bloque toutes les PR, y compris celles qui n'ont aucun rapport.
        run: node scripts/audit-gate.mjs
      - run: npm run check
      - run: npm run build
