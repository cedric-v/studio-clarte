# ═══════════════════════════════════════════════════════════════════
# Preview deploys for Studio Clarté draft PRs
#
# Copy this file into the CLIENT repo (.github/workflows/preview.yml),
# adjust PAGES_PROJECT / build command / output directory, add the two
# secrets below, then MERGE the workflow to main ONCE.
#
# How it works:
#   1. every PR (including the draft/* branches created by Studio Clarté)
#      builds the site and deploys a preview to Cloudflare Pages via Direct
#      Upload (no Git integration needed, production deploy untouched) ;
#   2. the preview URL is reported as a GitHub Deployment with environment
#      'preview' — Studio Clarté's status polling picks it up and shows
#      « Voir la Preview ↗ », then enables the merge button.
#
# Speed (recommended): node_modules is cached between runs (keyed on
# package-lock.json), so `npm ci` only runs when the lockfile changes —
# the biggest speedup for every preview. Optional site build caches
# (Eleventy / Astro / Vite) are provided commented-out below.
#
# Client prerequisites:
#   - a Cloudflare Pages project (create once): `npx wrangler pages project create <name>`
#   - repository secrets:
#       CLOUDFLARE_API_TOKEN   (Pages: Edit permission)
#       CLOUDFLARE_ACCOUNT_ID
#   - repository variable:  CF_PAGES_PROJECT = <project name>
# ═══════════════════════════════════════════════════════════════════
name: Preview (draft PR)

on:
  pull_request:

permissions:
  contents: read
  deployments: write # required to report the GitHub Deployment

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Cache node_modules (biggest win) ────────────────────────────────
      # `npm ci` DELETES node_modules, so it must be skipped on a cache hit —
      # otherwise the cache is useless. Key = lockfile hash (+ node version).
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-20-

      - name: Install dependencies
        run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'

      # ── Optional: site build caches (rolling cache) ─────────────────────
      # Uncomment the paths your build actually uses. Rolling cache =
      # restore the previous run's cache, then save a new one after the build.
      #   - Eleventy: .eleventy-cache/  (only if the site fetches remote data)
      #   - Astro:    .astro/           (content/astro build cache)
      #   - Vite:     node_modules/.vite
      # - name: Cache site build
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       .eleventy-cache
      #       .astro
      #       node_modules/.vite
      #     key: ${{ runner.os }}-site-cache-${{ github.sha }}
      #     restore-keys: |
      #       ${{ runner.os }}-site-cache-

      # - run: npm test          # optional: same tests as production

      # ⚠️ MIRROR YOUR PRODUCTION BUILD exactly (command, env secrets,
      # output directory) — the preview must reflect what prod will be.
      # Example (Eleventy, see docs/preview-cedricv.yml for the full version):
      - run: npm run build
        env:
          SOME_SECRET: ${{ secrets.SOME_SECRET }}

      - name: Deploy preview to Cloudflare Pages (Direct Upload)
        run: |
          npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="preview-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report the preview URL as a GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const url = `https://preview-${context.payload.pull_request.number}.${process.env.PAGES_PROJECT}.pages.dev`;
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: 'success',
              environment_url: url,
              description: `Preview: ${url}`,
            });
            console.log(`Preview: ${url}`);
