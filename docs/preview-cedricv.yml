# ═══════════════════════════════════════════════════════════════════
# Preview deploys for Studio Clarté draft PRs — site cedricv.com
#
# Install: copy to .github/workflows/preview.yml in the CLIENT repo,
# merge to main ONCE. Every PR (incl. Studio draft/* branches) builds
# and deploys a preview to the EXISTING Pages project (direct upload,
# production untouched — prod stays main-only after tests).
#
# Preview URL: https://preview-<PR>.cedric-v.pages.dev
# ═══════════════════════════════════════════════════════════════════
name: Preview (draft PR)

on:
  pull_request:

permissions:
  contents: read
  deployments: write # required to report the GitHub Deployment

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT: cedric-v
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same build as production (Eleventy), with the same env secrets.
      - name: Build
        run: ELEVENTY_ENV=prod npm run build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      - name: Deploy preview to Cloudflare Pages (Direct Upload)
        run: |
          npx wrangler pages deploy _site \
            --project-name="$PAGES_PROJECT" \
            --branch="preview-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report the preview URL as a GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const url = `https://preview-${context.payload.pull_request.number}.${process.env.PAGES_PROJECT}.pages.dev`;
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: 'success',
              environment_url: url,
              description: `Preview: ${url}`,
            });
            console.log(`Preview: ${url}`);
